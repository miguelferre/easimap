[project]
name = "easimap"
version = "0.1.0"
description = "EASiMap 2: pipeline que lleva estructuras de una familia de enzimas al marco del sustrato."
requires-python = ">=3.13"
dependencies = ["numpy", "pyhmmer", "gemmi", "biotite", "requests"]

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["pipeline"]
